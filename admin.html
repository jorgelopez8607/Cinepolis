<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Registro de Post-Créditos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF.js para leer el reporte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</head>
<body>

    <div class="screen active" style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <header class="app-header">
            <h2><i class="fa-solid fa-user-shield"></i> Admin Post-Créditos</h2>
            <button class="btn-secondary" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
        </header>

        <div class="upload-card" style="max-width: 100%; margin-bottom: 20px;">
            <div class="file-drop-area" id="admin-drop-area" style="cursor: pointer; padding: 30px; border: 2px dashed var(--card-border, #444); border-radius: 12px; text-align: center;">
                <i class="fa-solid fa-file-pdf pdf-icon" style="font-size: 40px; color: #ef4444; margin-bottom: 10px; display: block;"></i>
                <span class="file-msg" id="admin-file-label" style="font-size: 15px;">Haz clic aquí para seleccionar el PDF</span>
                <input type="file" id="admin-pdf-file" accept="application/pdf" style="display: none;">
            </div>
            <div id="file-status" class="file-name" style="margin-top: 15px; text-align: center; font-weight: bold; font-size: 15px;"></div>
        </div>

        <div id="movies-list-container" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
            <!-- Las tarjetas de películas con guardado individual se generan aquí -->
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
