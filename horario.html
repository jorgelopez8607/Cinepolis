<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horario de Funciones - Cinépolis</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* Banner superior de alertas y recordatorios */
        #delay-banner-container {
            margin: 15px auto 0 auto;
            max-width: 1200px;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .delay-reminder-note {
            background: rgba(59, 130, 246, 0.15);
            border: 1px dashed #3b82f6;
            color: #93c5fd;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delay-alert-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .delay-banner-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-cancel-delay {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-cancel-delay:hover {
            background: #ef4444;
            color: #fff;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            border-radius: 6px;
            padding: 6px 9px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn.btn-ok.active {
            background: #22c55e;
            color: #fff;
            border-color: #22c55e;
        }

        .action-btn.btn-clean.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .action-btn.btn-cancel.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        .action-btn.btn-delay.active {
            background: #f59e0b;
            color: #fff;
            border-color: #f59e0b;
        }

        /* EFECTOS DE ESTADO EN LAS TARJETAS */
        .movie-card.status-completada {
            opacity: 0.65;
            border-color: #22c55e !important;
        }
        .movie-card.status-completada .movie-title {
            text-decoration: line-through;
            color: #22c55e;
        }

        .movie-card.status-cancelada {
            opacity: 0.55;
            filter: grayscale(0.8);
            border-color: #ef4444 !important;
        }
        .movie-card.status-cancelada .movie-title {
            text-decoration: line-through;
            color: #ef4444;
        }

        .movie-card.has-delay {
            border-color: #f59e0b !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .movie-card.is-cleaned {
            box-shadow: inset 0 0 0 2px #3b82f6, 0 0 8px rgba(59, 130, 246, 0.3);
        }

        .delay-badge {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .clean-badge {
            background: #3b82f6;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            text-transform: uppercase;
        }

        .time-adjusted {
            color: #fbbf24;
            font-size: 11px;
            display: block;
            margin-top: 2px;
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .custom-modal-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .custom-modal-input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="app-screen" class="screen active">
        <header class="app-header">
            <div class="header-info">
                <h2><i class="fa-solid fa-clapperboard"></i> Programación de Cine</h2>
                <span id="active-range-badge" class="badge">Salas 1 - 20</span>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()" title="Cambiar Tema">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
                <button id="btn-back" class="btn-secondary" onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
            </div>
        </header>

        <!-- Contenedor para el aviso de desfase y recordatorio permanente superior -->
        <div id="delay-banner-container"></div>

        <div class="controls-bar">
            <div class="filter-group">
                <select id="sort-select">
                    <option value="start" selected>Ordenar por Hora de Inicio</option>
                    <option value="finish">Ordenar por Hora de Término</option>
                </select>
            </div>
        </div>

        <main id="schedule-container" class="cards-grid">
            <!-- Tarjetas generadas dinámicamente -->
        </main>
    </div>

    <!-- Modal para ingresar minutos de desfase -->
    <div id="delay-modal" class="modal-overlay hidden">
        <div class="custom-modal-box">
            <i class="fa-solid fa-clock-rotate-left" style="font-size: 32px; color: #f59e0b; margin-bottom: 10px;"></i>
            <h3>Desfase de Función</h3>
            <p style="font-size: 14px; color: #aaa;">Ingresa los minutos de retraso para esta sala:</p>
            <input type="number" id="delay-minutes-input" class="custom-modal-input" min="1" max="180" placeholder="Ej. 10">
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" style="flex: 1;" onclick="closeDelayModal()">Cancelar</button>
                <button class="btn-primary" style="flex: 1;" onclick="confirmDelay()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para ingresar el nombre de quien limpió -->
    <div id="clean-modal" class="modal-overlay hidden">
        <div class="custom-modal-box">
            <i class="fa-solid fa-broom" style="font-size: 32px; color: #3b82f6; margin-bottom: 10px;"></i>
            <h3>Limpieza de Sala</h3>
            <p style="font-size: 14px; color: #aaa;">¿Quién limpió la sala?</p>
            <input type="text" id="cleaner-name-input" class="custom-modal-input" placeholder="Escribe tu nombre" autocomplete="off">
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" style="flex: 1;" onclick="closeCleanModal()">Cancelar</button>
                <button class="btn-primary" style="flex: 1;" onclick="confirmClean()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/horario.js"></script>
</body>
</html>
