<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargar PDF - Cinépolis</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>

    <div id="upload-screen" class="screen active">
        <div class="upload-card">
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar Tema">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>

            <div class="brand">
                <i class="fa-solid fa-film brand-icon"></i>
                <h1>Procesador de Horarios</h1>
                <p>Cinépolis - Vista Entertainment Report</p>
            </div>

            <form id="setup-form">
                <div class="file-drop-area" id="drop-area">
                    <i class="fa-solid fa-file-pdf pdf-icon"></i>
                    <span class="file-msg">Arrastra tu archivo PDF aquí o haz clic para seleccionar</span>
                    <input type="file" id="pdf-file" accept="application/pdf" required>
                    <div id="file-name" class="file-name"></div>
                </div>

                <div class="room-range-container">
                    <label><i class="fa-solid fa-door-open"></i> Filtrar Rango de Salas:</label>
                    <div class="range-inputs">
                        <div class="input-group">
                            <span>Desde Sala:</span>
                            <input type="number" id="room-min" min="1" max="30" value="1" required>
                        </div>
                        <div class="input-group">
                            <span>Hasta Sala:</span>
                            <input type="number" id="room-max" min="1" max="30" value="7" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-process" class="btn-primary" disabled>
                    <i class="fa-solid fa-gears"></i> Cargar y Leer PDF
                </button>
            </form>

            <a href="admin.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; padding: 12px; background: rgba(255, 255, 255, 0.08); color: var(--text-primary, #ffffff); text-decoration: none; font-weight: 600; border-radius: 8px; border: 1px solid var(--card-border, #444); box-sizing: border-box; transition: background 0.2s;">
                <i class="fa-solid fa-user-shield"></i> Post Créditos
            </a>
        </div>
    </div>

    <script src="js/pdf-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
