<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cinépolis - Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="index-screen" class="screen active">
        <header class="app-header">
            <div class="header-info">
                <h2><i class="fa-solid fa-film"></i> Cartelera Interna</h2>
                <span class="badge">Cinépolis</span>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()" title="Cambiar Tema">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </header>

        <main class="index-container">
            <h2 class="welcome-title">¿Cómo deseas ingresar?</h2>

            <div class="role-selection">
                <button id="btn-cinepolito" class="role-card">
                    <i class="fa-solid fa-user-gear role-icon"></i>
                    <h3>Cinepolito</h3>
                    <p>Consultar la programación de salas</p>
                </button>

                <button id="btn-admin" class="role-card">
                    <i class="fa-solid fa-user-shield role-icon"></i>
                    <h3>Admin</h3>
                    <p>Administrar y subir PDF de horarios</p>
                </button>
            </div>

            <!-- Selección de Halls -->
            <div id="halls-section" class="halls-container hidden">
                <h3>Selecciona tu conjunto de salas:</h3>
                <div class="halls-buttons">
                    <button class="btn-primary hall-btn" onclick="selectHall(1, 7)">
                        <i class="fa-solid fa-door-open"></i> Hall 1 (Salas 1 - 7)
                    </button>
                    <button class="btn-primary hall-btn" onclick="selectHall(8, 16)">
                        <i class="fa-solid fa-door-open"></i> Hall 2 (Salas 8 - 16)
                    </button>
                    <button class="btn-primary hall-btn full-width" onclick="selectHall(1, 16)" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-layer-group"></i> Hall 1 y 2 (Salas 1 - 16)
                    </button>
                </div>
                <button class="btn-secondary back-role-btn" onclick="resetView()">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
            </div>

            <!-- Mensaje cuando NO hay horario -->
            <div id="no-schedule-message" class="no-schedule-box hidden">
                <i class="fa-solid fa-triangle-exclamation alert-icon"></i>
                <p>El admin aún no sube el horario</p>
                <button class="btn-secondary back-role-btn" onclick="resetView()">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
            </div>
        </main>
    </div>

    <!-- Modal Contraseña -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content auth-box">
            <span class="close-modal" onclick="closeAuthModal()">&times;</span>
            <i class="fa-solid fa-lock modal-lock-icon"></i>
            <h3>Acceso de Administrador</h3>
            <p>Ingresa la contraseña para continuar:</p>
            
            <form id="auth-form" onsubmit="validatePassword(event)">
                <input type="password" id="admin-password" placeholder="Contraseña" required autocomplete="off">
                <p id="auth-error" class="error-msg hidden">Contraseña incorrecta</p>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeAuthModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
